; Braid firmware - PlatformIO + ESP-IDF.
;
; DEVELOPMENT BUILDS ONLY. No Secure Boot, Flash Encryption, anti-rollback or
; NVS encryption in these envs (all one-way on the device). A *_production
; env is added only on an explicit request for a production build.
;
;   pio run -e esp32_dev      ESP32-WROOM-32E, 4 MB flash
;   pio run -e esp32s3_dev    ESP32-S3-WROOM-1 N8, 8 MB flash
;   pio run -e esp32_selftest   -t upload -t monitor   Appendix A self-test on ESP32
;   pio run -e esp32s3_selftest -t upload -t monitor   Appendix A self-test on ESP32-S3
;   (see SELFTEST.txt; prints "BR_SELFTEST RESULT: PASS n/n" or "FAIL k/n")
;
; Notes:
; - No top-level CMakeLists.txt is kept in git: PlatformIO generates
;   firmware/CMakeLists.txt on the first build (is_proper_idf_project()).
; - No main/idf_component.yml: no managed components (mbedtls is built in),
;   so configure never needs the network.
; - Strict warnings are per component (target_compile_options); the globals
;   below also compile ESP-IDF itself, so they stay lenient.
; - C++ standard: ESP-IDF 5.5's default -std=gnu++2b for every C++ TU. App
;   code is written to C++17. No -std override: build_unflags is global in
;   PlatformIO and would also strip IDF's own C++ standard, and PlatformIO
;   orders main's -std before IDF's, so a per-component override cannot
;   win for main. The protocol core is C11 (-std=c11, see app_braid).

[platformio]
default_envs = esp32_dev
src_dir = main

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug
; BR_NODE_MAX_TRANSPORTS=4: four transport slots (espnow + uart + udp +
; nrf24). Image-wide on purpose: br_node_init() refuses a sizeof(br_node_t)
; mismatch between translation units, so a per-component define would be
; refused at boot. firmware/host/CMakeLists.txt sets the same value for the
; host tests. The selftest envs inherit it through ${env.build_flags}.
build_flags =
    -Wall
    -Werror=return-type
    -Werror=implicit-fallthrough
    -Wno-error=format
    -DDEVELOPMENT_BUILD=1
    -DBR_NODE_MAX_TRANSPORTS=4

[env:esp32_dev]
board = esp32dev
board_build.partitions = partitions.csv

[env:esp32s3_dev]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_8mb.csv

; Self-test envs: the dev envs plus BR_SELFTEST. The CMake variable
; (cmake_extra_args) makes app_braid compile src/br_selftest.c with the
; Appendix A vectors and export BR_SELFTEST=1; the build flag mirrors it for
; every translation unit. Normal envs carry none of it.
[env:esp32_selftest]
extends = env:esp32_dev
build_flags =
    ${env.build_flags}
    -DBR_SELFTEST=1
board_build.cmake_extra_args = -DBR_SELFTEST=1

[env:esp32s3_selftest]
extends = env:esp32s3_dev
build_flags =
    ${env.build_flags}
    -DBR_SELFTEST=1
board_build.cmake_extra_args = -DBR_SELFTEST=1
