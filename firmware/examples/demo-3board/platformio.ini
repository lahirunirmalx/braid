; Braid 3-board demo (sender / relay / probe) - PlatformIO + ESP-IDF.
; See FLASH-DEMO.md. Build from this directory:
;
;   pio run -e esp32_dev      ESP32-WROOM-32E, 4 MB flash
;   pio run -e esp32s3_dev    ESP32-S3-WROOM-1 N8, 8 MB flash
;   pio run -e cardputer      M5Stack Cardputer (StampS3, 8 MB): ST7789 LCD,
;                             console on the native USB port (/dev/ttyACM0)
;
; The Braid stack (app_braid, app_hal, port_esp_idf, app_udp_link,
; app_nrf24_link) comes from ../../components (CMakeLists.txt,
; EXTRA_COMPONENT_DIRS); this example adds components/app_node and main/.
; Partition tables and version.txt are shared with firmware/; the
; sdkconfig.defaults* files here are copies of firmware/'s (keep in sync).
;
; DEVELOPMENT BUILDS ONLY. No Secure Boot, Flash Encryption, anti-rollback or
; NVS encryption. Build-flag and C++ standard notes: firmware/platformio.ini.

[platformio]
default_envs = esp32_dev
src_dir = main

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug
; BR_NODE_MAX_TRANSPORTS=4: image-wide on purpose (br_node_init() refuses a
; sizeof(br_node_t) mismatch between translation units); same value as
; firmware/host/CMakeLists.txt.
build_flags =
    -Wall
    -Werror=return-type
    -Werror=implicit-fallthrough
    -Wno-error=format
    -DDEVELOPMENT_BUILD=1
    -DBR_NODE_MAX_TRANSPORTS=4

[env:esp32_dev]
board = esp32dev
board_build.partitions = ../../partitions.csv

[env:esp32s3_dev]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions_8mb.csv

; M5Stack Cardputer: the S3 image plus NODE_BOARD_CARDPUTER (built-in ST7789
; LCD on SPI3 instead of the I2C display probe, whose S3 pins GPIO8 / 9 are
; keyboard lines there). Console input also works on any S3 build through
; the native USB port.
[env:cardputer]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions_8mb.csv
build_flags =
    ${env.build_flags}
    -DNODE_BOARD_CARDPUTER=1
